dataset:
  root: /Volumes/HD_cv/ego4d_full_data/v2
  video_dir: full_scale
  manifest: full_scale/manifest.csv
  read_only: true
  video_extension: .mp4

run:
  output_root: ../runs
  run_id: ego_nvs_smoke
  resume: true
  write_annotated_video: false
  write_crops: false

sample:
  n_videos: 1
  seed: 123
  first_seconds: 5.0
  frame_stride: 1
  split:
  scenario_contains:

model:
  detector: yolo
  weights: yolo11n.pt
  device: cpu
  conf_threshold: 0.25
  iou_threshold: 0.45
  tracker: botsort.yaml
  imgsz: 640
  half: false

features:
  color: true
  saliency: true
  flow: farneback
  embeddings: []
  segmentation:
  open_vocab_audit:
  predictability_history: 5

hpc:
  num_workers: 1
  shard_size: 1
  flush_every_n_frames: 200
