[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etch-mnemonic"
version = "0.1.0"
description = "Ego-NVS natural vision statistics extraction for ETCH mnemonic Aim 4"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.1",
  "pyyaml>=6.0.1",
  "pyarrow>=15.0.0",
  "opencv-python==4.9.0.80",
  "tqdm==4.66.4",
  "torch==2.2.0",
  "torchvision==0.17.0",
  "torchaudio==2.2.0",
  "ultralytics==8.3.0",
  "scikit-image==0.22.0",
  "matplotlib==3.8.2",
]

[project.optional-dependencies]
premium = [
  "transformers>=4.40",
  "accelerate>=0.30",
  "open-clip-torch>=2.24",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
etch = "etch.cli:main"

[tool.setuptools]
packages = ["etch"]

